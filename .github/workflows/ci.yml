name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  nucleo-e-interfaz:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run tipos
      - run: bun run lint
      - run: bun test
      - run: bun banco/ejecutar.ts --validar
      - run: bun run build
        working-directory: apps/escritorio

  app-tauri:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run compilar:nucleo
      - run: bun run build
        working-directory: apps/escritorio
      # El test del llavero toca el almacén de credenciales del sistema: se salta en CI.
      - run: cargo test -- --skip llavero
        working-directory: apps/escritorio/src-tauri

  # macOS como plataforma de primera clase: el núcleo, la interfaz y la app de Tauri, como en Windows.
  mac:
    runs-on: macos-latest
    env:
      # rust-toolchain.toml pide el toolchain MSVC de Windows.
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run tipos
      - run: bun run lint
      - run: bun test
      - run: bun banco/ejecutar.ts --validar
      - run: bun run compilar:nucleo:mac
      - run: bun run build
        working-directory: apps/escritorio
      # El test del llavero toca el Llavero de verdad: se salta en CI.
      - run: cargo test -- --skip llavero
        working-directory: apps/escritorio/src-tauri
      # El dictado de Mac compila (instalar.sh lo hace dentro de Aquiles.app), también universal.
      - run: swiftc -O -swift-version 5 -o /tmp/aquiles-dictado dictado.swift -Xlinker -sectcreate -Xlinker __TEXT -Xlinker __info_plist -Xlinker dictado-Info.plist
        working-directory: apps/escritorio/src-tauri/macos
      - run: mkdir -p /tmp/App.app/Contents/MacOS && /usr/libexec/PlistBuddy -c "Add :CFBundleName string App" /tmp/App.app/Contents/Info.plist && bash apps/escritorio/src-tauri/macos/compilar-dictado.sh /tmp/App.app --universal && lipo -info /tmp/App.app/Contents/MacOS/aquiles-dictado
      # El núcleo para Apple Silicon e Intel en uno (para la app universal).
      - run: bun scripts/compilar-nucleo.ts --universal && lipo -info apps/escritorio/src-tauri/binaries/aquiles-nucleo-universal-apple-darwin

  # Linux: el núcleo, la interfaz, la app de Tauri (con WebKitGTK) y sus paquetes .deb.
  linux:
    runs-on: ubuntu-latest
    env:
      # rust-toolchain.toml pide el toolchain MSVC de Windows.
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # Las mismas bibliotecas que instala instalar.sh con apt.
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libdbus-1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      # Ubuntu 24.04 no deja crear user namespaces sin privilegios (AppArmor) y el sandbox de Chrome los necesita: sin
      # esto, el Chrome del runner no llega a abrir el puerto de depuración en el test del navegador real.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bun install --frozen-lockfile
      - run: bun run tipos
      - run: bun run lint
      - run: bun test
      - run: bun banco/ejecutar.ts --validar
      - run: bash -n instalar.sh && bash -n scripts/app-linux.sh
      - run: bun run compilar:nucleo
      - run: bun run build
        working-directory: apps/escritorio
      # El test del llavero necesita un Secret Service (gnome-keyring) con sesión: se salta en CI.
      - run: cargo test -- --skip llavero
        working-directory: apps/escritorio/src-tauri
      - run: bash scripts/app-linux.sh deb && ls apps/escritorio/src-tauri/target/release/bundle/deb/*.deb

  # De extremo a extremo: el núcleo con el proveedor simulado, la interfaz compilada y Chromium (Playwright).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run e2e
