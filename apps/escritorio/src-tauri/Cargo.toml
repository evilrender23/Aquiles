[package]
name = "aquiles"
version = "0.0.1"
edition = "2021"

[lib]
name = "aquiles_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Los plugins con paquete JS van fijados a la misma versión menor que el de package.json:
# el CLI de Tauri no compila si no coinciden.
[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "~2.8"
tauri-plugin-notification = "~2.6"
tauri-plugin-autostart = "~2.7"
tauri-plugin-process = "~2.4"
tauri-plugin-updater = "~2.14"
tauri-plugin-global-shortcut = "~2.4"
tauri-plugin-single-instance = "~2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
tokio = { version = "1", features = ["time", "sync"] }

[dev-dependencies]
tauri = { version = "2", features = ["tray-icon", "test"] }
