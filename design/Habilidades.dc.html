<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Aquiles · Habilidades</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#0A0C0B}
a{color:#C6F36B}a:hover{color:#F2F4EF}
.wb{background:transparent}.wb:hover{background:#141816}
input::placeholder{color:#9AA39C}
:focus-visible{outline:2px solid #C6F36B;outline-offset:3px}
.branch{stroke-dasharray:60;stroke-dashoffset:0;animation:draw .4s cubic-bezier(.2,.7,.3,1) both}
.fold{animation:fold .3s cubic-bezier(.2,.7,.3,1) both}
@keyframes draw{from{stroke-dashoffset:60}to{stroke-dashoffset:0}}
@keyframes fold{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.branch,.fold{animation:none}}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; align-items: stretch; background: radial-gradient(1100px 560px at 70% -8%, #141816, #0A0C0B 70%); color: #E9EDE7; font-family: 'Outfit', system-ui, sans-serif;">

  <div style="flex: 1 1 260px; max-width: 100%; border-right: 1px solid #262D28;">
    <dc-import name="Sidebar" active="skills" hint-size="260px,900px"></dc-import>
  </div>

  <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column;">
    <div style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 8px 0 32px; border-bottom: 1px solid #262D28;">
      <span style="font-size: 13px; color: #9AA39C;">~/proyectos/aquiles-app</span>
      <div style="flex: 1 1 auto;"></div>
      <button type="button" class="wb" aria-label="Minimizar" style="width: 40px; height: 32px; border: 0; border-radius: 8px; color: #E9EDE7; display: inline-flex; align-items: center; justify-content: center; cursor: pointer;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path></svg></button>
      <button type="button" class="wb" aria-label="Maximizar" style="width: 40px; height: 32px; border: 0; border-radius: 8px; color: #E9EDE7; display: inline-flex; align-items: center; justify-content: center; cursor: pointer;"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"></rect></svg></button>
      <button type="button" class="wb" aria-label="Cerrar" style="width: 40px; height: 32px; border: 0; border-radius: 8px; color: #E9EDE7; display: inline-flex; align-items: center; justify-content: center; cursor: pointer;"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
    </div>

    <main style="flex: 1 1 auto; display: flex; flex-wrap: wrap; align-items: stretch;">
      <section style="flex: 999 1 520px; min-width: 0; padding: 40px 48px 56px; display: flex; flex-direction: column; gap: 28px;">
        <div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 20px;">
          <div style="flex: 1 1 360px; display: flex; flex-direction: column; gap: 14px;">
            <span style="font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0.32em; text-transform: uppercase; color: #9AA39C;">Aprendidas · Instaladas</span>
            <h1 style="margin: 0; font-size: 72px; line-height: 0.92; font-weight: 800; letter-spacing: -0.045em; text-transform: uppercase; color: #F2F4EF;">Habilidades<span style="color: #C6F36B;">.</span></h1>
          </div>
          <button type="button" style="height: 56px; padding: 0 26px; border-radius: 999px; border: 0; background: linear-gradient(135deg, #D9FA8A, #8FD14F); box-shadow: 0 12px 48px rgba(198,243,107,0.35); color: #0A0C0B; font: 600 16px 'Outfit', sans-serif; display: inline-flex; align-items: center; gap: 10px; cursor: pointer;">Nueva habilidad<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"></path><path d="M7 7h10v10"></path></svg></button>
        </div>

        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px;">
          <label style="flex: 1 1 260px; min-width: 0; display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 18px; border-radius: 999px; background: #141816; border: 1px solid #262D28; color: #9AA39C;">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
            <input type="search" aria-label="Buscar habilidades" placeholder="Buscar por nombre o descripción" style="flex: 1 1 auto; min-width: 0; border: 0; background: transparent; font: 400 15px 'Outfit', sans-serif; color: #F2F4EF;">
          </label>
          <div role="group" aria-label="Filtrar" style="display: flex; flex-wrap: wrap; gap: 8px;">
            <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
              <button type="button" aria-pressed="{{f.active}}" onClick="{{f.pick}}" style="{{f.style}}">{{f.label}}</button>
            </sc-for>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px;">
          <sc-for list="{{skills}}" as="s" hint-placeholder-count="6">
            <button type="button" onClick="{{s.pick}}" aria-pressed="{{s.selected}}" style="{{s.cardStyle}}">
              <span style="display: flex; justify-content: space-between; align-items: center;">
                <span style="font-size: 15px; font-weight: 700; color: #C6F36B;">{{s.n}}</span>
                <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E9EDE7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"></path><path d="M7 7h10v10"></path></svg>
              </span>
              <span style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 8px; justify-content: flex-end;">
                <span style="font-size: 22px; line-height: 28px; font-weight: 600; letter-spacing: -0.02em; color: #F2F4EF; overflow-wrap: anywhere;">{{s.name}}</span>
                <span style="font-size: 15px; line-height: 24px; color: #9AA39C;">{{s.desc}}</span>
              </span>
              <span style="font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0.32em; text-transform: uppercase; color: #9AA39C;">{{s.meta}}</span>
            </button>
          </sc-for>
        </div>
      </section>

      <aside aria-label="Detalle de la habilidad" style="flex: 1 1 380px; min-width: 0; padding: 40px 28px 56px; border-left: 1px solid #262D28;">
        <div style="display: flex; flex-direction: column; gap: 22px; padding: 28px; background: #141816; border: 1px solid #262D28; border-radius: 28px;">
          <span style="font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0.32em; text-transform: uppercase; color: #9AA39C;">{{sel.origin}}</span>
          <h2 style="margin: 0; font-size: 32px; line-height: 36px; font-weight: 700; letter-spacing: -0.035em; color: #F2F4EF; overflow-wrap: anywhere;">{{sel.name}}</h2>
          <p style="margin: 0; font-size: 16px; line-height: 26px; color: #E9EDE7;">{{sel.desc}}</p>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; padding: 18px 0; border-top: 1px solid #262D28; border-bottom: 1px solid #262D28;">
            <div style="display: flex; flex-direction: column; gap: 4px;">
              <span style="font-size: 36px; line-height: 40px; font-weight: 700; letter-spacing: -0.035em; color: #C6F36B;">{{sel.uses}}</span>
              <span style="font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0.32em; text-transform: uppercase; color: #9AA39C;">Usos</span>
            </div>
            <div style="display: flex; flex-direction: column; gap: 4px;">
              <span style="font-size: 36px; line-height: 40px; font-weight: 700; letter-spacing: -0.035em; color: #F2F4EF;">{{sel.updated}}</span>
              <span style="font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0.32em; text-transform: uppercase; color: #9AA39C;">Actualizada</span>
            </div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 8px;">
            <span style="font-size: 13px; color: #9AA39C;">{{sel.file}}</span>
            <pre style="margin: 0; padding: 16px 18px; background: #0D100E; border-radius: 14px; font: 13px/1.65 ui-monospace, SFMono-Regular, Consolas, monospace; color: #E9EDE7; white-space: pre-wrap; overflow-x: auto;">{{sel.doc}}</pre>
          </div>
          <a href="Main.dc.html" style="display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 500; text-decoration: underline; text-decoration-color: rgba(198,243,107,0.4); text-underline-offset: 4px;">Ver sesión de origen<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></a>
          <div style="display: flex; flex-wrap: wrap; gap: 8px;">
            <button type="button" style="height: 44px; padding: 0 20px; border-radius: 999px; border: 1px solid #3A443D; background: transparent; color: #E9EDE7; font: 600 13px 'Outfit', sans-serif; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer;">Editar</button>
            <button type="button" style="height: 44px; padding: 0 20px; border-radius: 999px; border: 1px solid #3A443D; background: transparent; color: #E9EDE7; font: 600 13px 'Outfit', sans-serif; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer;">Versiones</button>
            <button type="button" style="height: 44px; padding: 0 16px; border-radius: 999px; border: 0; background: transparent; color: #9AA39C; font: 600 13px 'Outfit', sans-serif; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer;">{{sel.toggle}}</button>
          </div>
        </div>
      </aside>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1200}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 'migrar-electron-tauri', filter: 'all' };
  }
  renderVals() {
    const all = [
      { name: 'migrar-electron-tauri', learned: true, off: false, desc: 'Porta una app Electron a Tauri 2 conservando el puente IPC tipado.', uses: 3, updated: '30 oct', steps: ['Instalar @tauri-apps/cli@2 con pnpm', 'Generar src-tauri/ y copiar iconos', 'Convertir cada ipcMain.handle en #[tauri::command]', 'Sustituir ipcRenderer por invoke()', 'Retirar electron del package.json'] },
      { name: 'commits-convencionales', learned: false, off: false, desc: 'Redacta commits en español con el formato Conventional Commits.', uses: 58, updated: '12 ago', steps: ['Leer el diff preparado', 'Elegir tipo: feat, fix, refactor, docs o chore', 'Resumen en imperativo, máximo 72 caracteres'] },
      { name: 'resumen-issues-github', learned: true, off: false, desc: 'Agrupa los issues nuevos por etiqueta y envía un resumen a Telegram.', uses: 21, updated: '27 oct', steps: ['Consultar issues de las últimas 24 h', 'Agrupar por etiqueta', 'Enviar el resumen al canal'] },
      { name: 'depurar-ipc', learned: true, off: false, desc: 'Localiza fugas de memoria entre el renderer y el proceso principal.', uses: 4, updated: '24 oct', steps: ['Tomar dos instantáneas del heap', 'Comparar listeners registrados', 'Revisar suscripciones sin cancelar'] },
      { name: 'revisar-tipos-ts', learned: false, off: false, desc: 'Ejecuta tsc en modo estricto y propone arreglos archivo por archivo.', uses: 37, updated: '2 oct', steps: ['pnpm tsc --noEmit --strict', 'Agrupar errores por archivo', 'Proponer un parche por archivo'] },
      { name: 'release-windows', learned: true, off: false, desc: 'Firma, empaqueta y publica el instalador MSI.', uses: 6, updated: '19 oct', steps: ['Compilar en modo release', 'Firmar con el certificado del equipo', 'Subir el MSI a GitHub Releases'] },
      { name: 'notas-de-reunion', learned: false, off: false, desc: 'Convierte una transcripción en acta con decisiones y tareas.', uses: 12, updated: '9 sep', steps: ['Extraer decisiones', 'Extraer tareas con responsable', 'Guardar en docs/actas/'] },
      { name: 'auditoria-dependencias', learned: true, off: true, desc: 'Revisa pnpm audit y abre un PR con las actualizaciones seguras.', uses: 2, updated: '1 sep', steps: ['pnpm audit --json', 'Filtrar parches sin cambios mayores', 'Abrir PR con el resumen'] }
    ];
    const f = this.state.filter;
    const pill = (on) => ({
      height: 40, padding: '0 16px', borderRadius: 999, cursor: 'pointer',
      font: "500 14px 'Outfit', sans-serif",
      background: on ? 'rgba(198,243,107,0.12)' : '#141816',
      border: '1px solid ' + (on ? 'rgba(198,243,107,0.45)' : '#262D28'),
      color: on ? '#F2F4EF' : '#9AA39C'
    });
    const filterDefs = [
      { id: 'all', label: 'Todas · 8' },
      { id: 'learned', label: 'Aprendidas · 4' },
      { id: 'installed', label: 'Instaladas · 3' },
      { id: 'off', label: 'Desactivadas · 1' }
    ];
    const visible = all.filter((s) => f === 'all' || (f === 'learned' && s.learned && !s.off) || (f === 'installed' && !s.learned && !s.off) || (f === 'off' && s.off));
    const raw = all.find((s) => s.name === this.state.picked) || all[0];
    const sel = {
      ...raw,
      origin: raw.learned ? 'Creada por Aquiles' : 'Instalada a mano',
      toggle: raw.off ? 'Activar' : 'Desactivar',
      file: '~/.aquiles/skills/' + raw.name + '/SKILL.md',
      doc: '---\nname: ' + raw.name + '\ndescription: ' + raw.desc + '\n---\n\n## Pasos\n' + raw.steps.map((x, i) => (i + 1) + '. ' + x).join('\n')
    };
    return {
      filters: filterDefs.map((d) => ({ ...d, active: d.id === f, style: pill(d.id === f), pick: () => this.setState({ filter: d.id }) })),
      skills: visible.map((s) => {
        const selected = s.name === this.state.picked;
        return {
          ...s,
          n: String(all.indexOf(s) + 1).padStart(2, '0'),
          meta: (s.off ? 'Desactivada' : (s.learned ? 'Aprendida' : 'Instalada')) + ' · ' + s.uses + ' usos',
          selected,
          cardStyle: {
            display: 'flex', flexDirection: 'column', gap: 18, minHeight: 230, padding: 28, textAlign: 'left', cursor: 'pointer',
            font: "400 15px 'Outfit', sans-serif", color: '#E9EDE7',
            background: '#141816', borderRadius: 18,
            border: (s.off ? '1px dashed ' : '1px solid ') + (selected ? 'rgba(198,243,107,0.45)' : (s.off ? '#3A443D' : '#262D28'))
          },
          pick: () => this.setState({ picked: s.name })
        };
      }),
      sel
    };
  }
}
</script>
</body>
</html>
